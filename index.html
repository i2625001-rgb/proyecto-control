<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="PROYECTO CONTROL — organización personal">
<link rel="manifest" href="manifest.json">
<title>PROYECTO CONTROL</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:20px 18px 16px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:24px}.sub{opacity:.75;font-size:13px;margin-top:4px}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:white;border-bottom:1px solid #ddd;position:sticky;top:78px;z-index:4}
nav button{border:0;background:#eef0f3;border-radius:20px;padding:9px 13px;white-space:nowrap}
nav button.active{background:#111827;color:white}
main{max-width:760px;margin:auto;padding:16px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px;background:#f8fafc;border-radius:12px}
.stat b{display:block;font-size:22px}.muted{color:#6b7280;font-size:13px}
input,textarea,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;margin:5px 0 10px;font:inherit}
button.primary{background:#111827;color:white;border:0;padding:11px 15px;border-radius:10px;font-weight:600}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.item:last-child{border:0}
.check{width:20px;height:20px}.danger{color:#b91c1c;border:0;background:none}.install{display:none;background:#fff;padding:10px 14px;border-radius:10px;border:0;margin-top:12px}
h2{margin-top:4px}.tag{display:inline-block;background:#e5e7eb;border-radius:20px;padding:5px 9px;font-size:12px;margin:2px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<h1>PROYECTO CONTROL</h1><div class="sub">Organiza tu vida. Un día a la vez.</div>
<button id="install" class="install">📲 Instalar en mi celular</button>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<script src="app.js"></script>
</body>
</html>
